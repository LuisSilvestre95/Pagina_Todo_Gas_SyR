name: Publicar en GitHub Pages

on:
  push:
    branches: [main, master, claude/exciting-gauss-3x4kud]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar fotos IA (solo si faltan)
        run: |
          missing=0
          while read -r name url; do
            [[ -z "${name:-}" || "$name" == \#* ]] && continue
            [[ -f "public/assets/img/ia/$name.jpg" ]] || missing=1
          done < scripts/fotos-ia.txt
          if [[ $missing == 1 ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
            bash scripts/descargar-fotos-ia.sh || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/assets/img/ia
            if ! git diff --cached --quiet; then
              git commit -m "Agregar fotos IA optimizadas"
              git push || echo "No se pudo guardar en el repo; se publican igual."
            fi
          fi

      - name: Preparar sitio estático
        run: |
          mkdir _site
          cp -r public/. _site/
          # El panel admin necesita el servidor Node: no se publica en Pages.
          rm -f _site/admin.html _site/js/admin.js
          # La página 404 usa rutas absolutas: se ajustan a /<repositorio>/.
          sed -i 's#="/#="/${{ github.event.repository.name }}/#g' _site/404.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
